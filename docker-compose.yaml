x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432

x-minio-env: &minio-env
  MINIO_ENDPOINT: "minio:9000"
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}

x-cvat-env: &cvat-env
  CVAT_HOST: http://cvat-server:8080
  CVAT_EMAIL: ${CVAT_EMAIL}
  CVAT_PASSWORD: ${CVAT_PASSWORD}
  CVAT_SHARE_ROOT: /app/cvat_share
  CVAT_PUBLIC_URL: "http://localhost:8080"

x-python-service-env: &python-service-env
  <<: [*postgres-env, *minio-env, *cvat-env]
  COMMA_JWT: ${COMMA_JWT}
  PYTHONPATH: /app/shared:/app/backend
  CVAT_PUBLIC_URL: "http://localhost:8080"
  FRONTEND_URL: "http://localhost:5173"

x-frontend-env: &frontend-env
  VITE_API_URL: "http://localhost:8000"

x-data-worker: &data-worker
  environment:
    <<: *python-service-env
  volumes:
    - "./data:/app/data"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio/data:/data
      - ./minio/minio.license:/minio.license
      - ./minio/certs:/etc/minio/certs
    command: server /data --console-address ":9001"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      <<: *python-service-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
    networks:
      - default
      - cvat_network

  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile
        target: dev
      ports:
        - "5173:5173"
      environment:
        <<: *frontend-env
      depends_on:
        - backend
      develop:
        watch:
          - action: sync
            path: ./frontend/src
            target: /app/src
          - action: sync
            path: ./frontend/public
            target: /app/public
          - action: sync+restart
            path: ./frontend/index.html
            target: /app/index.html
          - action: rebuild
            path: ./frontend/package.json

  open_pilot_download_worker:
    <<: *data-worker
    build:
      context: .
      dockerfile: open_pilot_download_worker/Dockerfile
      args:
        JWT: ${COMMA_JWT}
    shm_size: 2g

  open_pilot_upload_worker:
    <<: *data-worker
    build:
      context: .
      dockerfile: open_pilot_upload_worker/Dockerfile

  dataset_export_worker:
    build:
      context: .
      dockerfile: dataset_export_worker/Dockerfile
    environment:
      <<: *python-service-env
    volumes:
      - "./data_exports:/app/data_exports"

  minio_initializer:
    build:
      context: .
      dockerfile: minio_initializer/Dockerfile
    environment:
      <<: *python-service-env

  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    environment:
      <<: [*python-service-env, *cvat-env]
    networks:
      - default
      - cvat_network

  alembic_worker:
    build:
      context: .
      dockerfile: alembic_worker/Dockerfile
    environment:
      <<: *postgres-env
      COMMA_JWT: ${COMMA_JWT}
      PYTHONPATH: /app/shared
      CVAT_PUBLIC_URL: "http://localhost:8080"
    volumes:
      - ./alembic_worker:/app/alembic_worker
      - ./shared:/app/shared
    depends_on:
      - postgres

  cvat_worker:
    build:
      context: .
      dockerfile: cvat_worker/Dockerfile
    environment:
      <<: [*postgres-env, *minio-env, *cvat-env]
    volumes:
      - ./cvat_share:/app/cvat_share
      - ./annotations:/app/annotations
        - mila_model_cache:/root/.cache/huggingface
    networks:
      - default
      - cvat_network
    depends_on:
      - postgres

  cvat_import_export_worker:
    build:
      context: .
      dockerfile: cvat_import_export_worker/Dockerfile
    environment:
      <<: [*postgres-env, *minio-env, *cvat-env]
    volumes:
      - ./cvat_share:/app/cvat_share
      - ./annotations:/app/annotations
    networks:
      - default
      - cvat_network
    depends_on:
      - postgres

networks:
  cvat_network:
    external: true

volumes:
  mila_model_cache:
